[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvzr-save-editor"
version = "1.0.0"
description = "Save editor for Plants vs. Zombies: Replanted"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # tkinter ships with Python; no third-party runtime deps

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pillow"]

[project.gui-scripts]
pvzr-save-editor = "pvzr_save_editor.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pvzr_save_editor = ["assets/*"]
